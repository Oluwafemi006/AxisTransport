# Lancement sur le VPS (API, PostgreSQL, site, proxy Caddy). Voir DEPLOY.md, section « VPS ».
# Jamais exécuté sur un serveur réel au moment où ce fichier a été écrit : seulement validé en syntaxe.
#
#   docker compose --env-file .env.vps -f compose.vps.yaml up -d --build
#
# Seul Caddy publie des ports (80 et 443). Les autres services ne sont joignables que depuis Caddy :
# un port publié par Docker contourne le pare-feu ufw, il ne faut donc en publier aucun autre.
# Aucun compte ni donnée de démonstration : « seed_demo » refuse de tourner sans debug.

x-backend-environment: &backend-environment
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY doit être définie dans .env.vps}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS doit être définie dans .env.vps}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?DJANGO_CORS_ALLOWED_ORIGINS doit être définie dans .env.vps}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DATABASE_URL: postgresql://axis:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être définie dans .env.vps}@db:5432/axis
  AXIS_ADMIN_USERNAME: ${AXIS_ADMIN_USERNAME:-}
  AXIS_ADMIN_PASSWORD: ${AXIS_ADMIN_PASSWORD:-}
  AXIS_ADMIN_EMAIL: ${AXIS_ADMIN_EMAIL:-}
  ACTIVE_PAYMENT_PROVIDER: fedapay
  FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
  FEDAPAY_WEBHOOK_SECRET: ${FEDAPAY_WEBHOOK_SECRET:-}
  FEDAPAY_ENVIRONMENT: ${FEDAPAY_ENVIRONMENT:-sandbox}
  FEDAPAY_WEBHOOK_TOLERANCE_SECONDS: ${FEDAPAY_WEBHOOK_TOLERANCE_SECONDS:-300}
  FEDAPAY_CALLBACK_URL: ${FEDAPAY_CALLBACK_URL:-}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
  # Un seul proxy (Caddy) devant l'API : sert à lire la vraie adresse IP du visiteur pour les limites de requêtes.
  AXIS_NUM_PROXIES: ${AXIS_NUM_PROXIES:-1}
  AXIS_CACHE_DIR: /tmp/axis-cache
  AXIS_PARCEL_TRACKING_RATE: ${AXIS_PARCEL_TRACKING_RATE:-20/min}
  AXIS_PUBLIC_TICKET_RATE: ${AXIS_PUBLIC_TICKET_RATE:-60/min}
  AXIS_PAYMENT_RECONCILE_ENABLED: ${AXIS_PAYMENT_RECONCILE_ENABLED:-true}
  AXIS_PAYMENT_RECONCILE_WINDOW_MINUTES: ${AXIS_PAYMENT_RECONCILE_WINDOW_MINUTES:-1440}
  AXIS_PAYMENT_RECONCILE_BATCH: ${AXIS_PAYMENT_RECONCILE_BATCH:-20}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: axis
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être définie dans .env.vps}
    volumes:
      - vps_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axis -d axis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py bootstrap_axis &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - vps_media:/app/media
      - vps_cache:/tmp/axis-cache
    depends_on:
      db:
        condition: service_healthy

  # Libère chaque minute les sièges dont la réservation temporaire a expiré.
  holds:
    build: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command: >-
      sh -c "while true; do sleep 60; python manage.py expire_ticket_holds; done"
    depends_on:
      backend:
        condition: service_started

  # Réinterroge FedaPay pour les paiements que ni le client ni le webhook n'ont confirmés.
  payments:
    build: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command: >-
      sh -c "while true; do sleep ${AXIS_PAYMENT_RECONCILE_INTERVAL_SECONDS:-60}; python manage.py reconcile_payments; done"
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Lue au moment du build : après l'avoir changée, il faut reconstruire le site.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL doit être définie dans .env.vps}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AXIS_DOMAIN: ${AXIS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile.http (variante A) ou Caddyfile.https (variante B)
      - ./deploy/${AXIS_CADDYFILE:?AXIS_CADDYFILE doit valoir Caddyfile.http ou Caddyfile.https}:/etc/caddy/Caddyfile:ro
      - vps_caddy_data:/data
      - vps_caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  vps_postgres_data:
  vps_media:
  vps_cache:
  vps_caddy_data:
  vps_caddy_config:
