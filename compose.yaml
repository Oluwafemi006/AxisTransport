services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axis_transport
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: axis
    volumes:
      - axis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axis -d axis_transport"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-local-compose-key}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*,localhost,127.0.0.1,backend,${AXIS_LAN_IP:-127.0.0.1}"
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://${AXIS_LAN_IP:-127.0.0.1}:3000
      DATABASE_URL: postgresql://axis:axis@db:5432/axis_transport
      AXIS_ADMIN_USERNAME: ${AXIS_ADMIN_USERNAME:-}
      AXIS_ADMIN_PASSWORD: ${AXIS_ADMIN_PASSWORD:-}
      ACTIVE_PAYMENT_PROVIDER: ${ACTIVE_PAYMENT_PROVIDER:-fedapay}
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY:-}
      FEDAPAY_WEBHOOK_SECRET: ${FEDAPAY_WEBHOOK_SECRET:-}
      FEDAPAY_ENVIRONMENT: ${FEDAPAY_ENVIRONMENT:-sandbox}
      FEDAPAY_WEBHOOK_TOLERANCE_SECONDS: ${FEDAPAY_WEBHOOK_TOLERANCE_SECONDS:-300}
      AXIS_PAYMENT_SIMULATION: ${AXIS_PAYMENT_SIMULATION:-false}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py bootstrap_axis &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
      - axis_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  axis_postgres_data:
  axis_media:
